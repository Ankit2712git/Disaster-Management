<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background with subtle corner radius for app icon -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  
  <!-- Outer Tactical Radar Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#f59e0b" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#dc2626" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Compass Crosshairs -->
  <line x1="256" y1="36" x2="256" y2="76" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="256" y1="436" x2="256" y2="476" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="36" y1="256" x2="76" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <line x1="436" y1="256" x2="476" y2="256" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>

  <!-- Tactical Emergency Shield Core -->
  <path d="M 256 100 L 370 150 C 370 280 256 380 256 380 C 256 380 142 280 142 150 Z" 
        fill="url(#shieldGrad)" 
        stroke="#fca5a5" 
        stroke-width="6" 
        filter="drop-shadow(0 12px 24px rgba(220,38,38,0.5))"/>

  <!-- Gold Inner Trim -->
  <path d="M 256 122 L 348 162 C 348 266 256 348 256 348 C 256 348 164 266 164 162 Z" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="3" 
        stroke-opacity="0.85"/>

  <!-- Central Rescue Medical Cross & Signal Pulse -->
  <rect x="236" y="170" width="40" height="110" rx="8" fill="#ffffff"/>
  <rect x="201" y="205" width="110" height="40" rx="8" fill="#ffffff"/>

  <!-- Pulse Star Center -->
  <circle cx="256" cy="225" r="10" fill="#f59e0b"/>
</svg>
